---
name: Bash CI

on:
  push:
    branches: [ master ]
    paths:
      - '**/*.sh'
      - '.github/workflows/bash-ci.yaml'
  pull_request:
    paths:
      - '**/*.sh'
      - '.github/workflows/bash-ci.yaml'

jobs:
  lint-and-formatter:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt update && sudo apt install shellcheck shfmt --yes

      - name: Run formatter using shfmt
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r shfmt -d -i 2

      - name: Run shellcheck
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
