---
name: Lua CI

on:
  push:
    branches: [ master ]

jobs:
  formatter:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: "0.20.0"
          args: --check --config-path hammerspoon/.stylua.toml .
