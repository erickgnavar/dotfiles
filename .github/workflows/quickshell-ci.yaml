---
name: Quickshell CI

on:
  push:
    branches: [ master ]
    paths:
      - 'quickshell/**'
      - 'sway/scripts/lockscreen.sh'
      - 'sway/config'
      - 'nixos/configuration.nix'
      - 'nixos/flake.lock'
      - 'wlogout/layout'
      - '.github/workflows/quickshell-ci.yaml'
  pull_request:
    paths:
      - 'quickshell/**'
      - 'sway/scripts/lockscreen.sh'
      - 'sway/config'
      - 'nixos/configuration.nix'
      - 'nixos/flake.lock'
      - 'wlogout/layout'
      - '.github/workflows/quickshell-ci.yaml'

permissions:
  contents: read

jobs:
  qml:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.5

      - name: Check QML parsing and imports
        run: nix-shell --pure quickshell/qml-check.nix --run 'bash quickshell/check-qml.sh'

  tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run Quickshell lock screen tests
        run: python3 -B -m unittest discover -s quickshell/lockscreen/tests -v

      - name: Run Quickshell capture tests
        run: python3 -B -m unittest discover -s quickshell/desktop/capture/tests -v

      - name: Run Quickshell dock tests
        run: python3 -B -m unittest discover -s quickshell/desktop/dock/tests -v

      - name: Run Quickshell app switcher tests
        run: python3 -B -m unittest discover -s quickshell/desktop/app_switcher/tests -v

      - name: Run Quickshell color picker tests
        run: python3 -B -m unittest discover -s quickshell/desktop/color_picker/tests -v
