---
name: TypeScript CI

on:
  push:
    branches: [ master ]
    paths:
      - '.pi/**/*.ts'
      - '.pi/agent/extensions/optchat/test/**'
      - '.github/workflows/typescript-ci.yaml'
  pull_request:
    paths:
      - '.pi/**/*.ts'
      - '.pi/agent/extensions/optchat/test/**'
      - '.github/workflows/typescript-ci.yaml'

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Lint TypeScript files in .pi
        run: find .pi -type f -name '*.ts' -exec npx --yes @biomejs/biome@2.4.6 lint {} +

      - name: Check TypeScript formatting in .pi
        run: npx --yes prettier@3.8.1 --check '.pi/**/*.ts'

      - name: Run OptChat unit tests
        run: node --experimental-strip-types .pi/agent/extensions/optchat/test/optchat.test.mjs

      - name: Install Pi for OptChat integration tests
        run: |
          npm install --global --prefix "$RUNNER_TEMP/optchat-pi" --ignore-scripts \
            @earendil-works/pi-coding-agent@1.4.0

      - name: Run OptChat integration tests
        run: |
          node .pi/agent/extensions/optchat/test/integration.test.mjs \
            "$RUNNER_TEMP/optchat-pi/lib/node_modules/@earendil-works/pi-coding-agent"
