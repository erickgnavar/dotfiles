---
name: TypeScript CI

on:
  push:
    branches: [ master ]
    paths:
      - '.pi/**/*.ts'
      - '.github/workflows/typescript-ci.yaml'
  pull_request:
    paths:
      - '.pi/**/*.ts'
      - '.github/workflows/typescript-ci.yaml'

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Lint TypeScript files in .pi
        run: find .pi -type f -name '*.ts' -exec npx --yes @biomejs/biome@2.4.6 lint {} +

      - name: Check TypeScript formatting in .pi
        run: npx --yes prettier@3.8.1 --check '.pi/**/*.ts'
